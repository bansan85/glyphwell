# glyphwell search template — duplicate and adapt.
#
# This file is data: no code is ever executed from it. It is versionable and hashed
# (SHA-256 of the full text). This hash identifies the search: as soon as the file
# changes, `glyphwell search run` creates a new run instead of reusing results obtained
# with a different prompt. A run in progress therefore stays resumable even if you edit
# this file in the meantime.
#
# Launch:  uv run glyphwell search run searches/example.yaml --limit 20

name: concealment_methods
description: >
  Analyzes excerpts of movie and TV show subtitles to identify specific methods,
  techniques, and strategies used by perpetrators to conceal crimes, destroy evidence,
  evade forensic detection, or mislead law enforcement investigations.

# Ollama model. Must be available locally
# (`ollama pull fredrezones55/Qwen3.5-Uncensored-HauhauCS-Aggressive:9b`):
# the command checks this before scanning the corpus.
model: fredrezones55/Qwen3.5-Uncensored-HauhauCS-Aggressive:9b

# Options passed through as-is to Ollama.
# temperature 0: reproducible results are wanted from one run to the next.
# num_ctx and num_predict are required: the number of sentences per chunk (see `chunk`
# below) is derived from them, together with each sentence's own length, instead of being
# set by hand — so the two can no longer drift out of sync.
# num_predict also bounds the response length AND, indirectly, the chunk itself: a chunk
# is never sized past num_predict tokens, since a bigger one risks the model having more
# findings to report than num_predict leaves room for — an incomplete, invalid JSON
# response rather than a graceful cutoff. Raise num_predict for denser chunks, not just
# for a longer response budget.
options:
  temperature: 0
  num_ctx: 24576
  num_predict: 1024

# --------------------------------------------------------------------------------------
# Which subtitles to analyze
# --------------------------------------------------------------------------------------
# Filters on the title (type, year, adult content) require the IMDb datasets to have been
# imported: `glyphwell metadata fetch-imdb && glyphwell metadata import-imdb`.
# Without them, files whose identifier is not resolved are excluded.
select:
  languages: [en]
  title_types: [] # empty = all types
  years:
    min: null
    max: null
  # null or an explicit list of bare numeric ids: [133093]. A series id expands to
  # every one of its episodes (matched via the IMDb datasets' parent-title link).
  imdb_ids: [7335184]
  # OpenSubtitles often carries several independent translations for the same
  # (imdb_id, language). true (the default) keeps only the one most likely to carry the
  # fullest legitimate dialogue transcript, cutting redundant Ollama calls (ADR-0020).
  # Requires `subtitle_files.size_bytes`, populated by `corpus index`.
  one_subtitle_per_title: true

# --------------------------------------------------------------------------------------
# Chunking — unit of model calls AND unit of resuming
# --------------------------------------------------------------------------------------
# A subtitle is split into chunks sized automatically from `options.num_ctx` and
# `options.num_predict` — see doc/search.md. `overlap` sentences are repeated from one
# chunk to the next so an exchange is not cut in two.
#
# A larger `num_predict` (within what `num_ctx` can hold) therefore means fewer calls,
# more context per call, but a coarser resume grain: an interruption loses at most one
# chunk of work. Keep `overlap` modest relative to how many sentences typically fit in the
# budget — a large overlap on a tightly-filled chunk repeats most of it into the next one.
chunk:
  overlap: 5

# --------------------------------------------------------------------------------------
# Prefilter — evaluated locally, before any call to the model
# --------------------------------------------------------------------------------------
# An LLM call costs orders of magnitude more than a substring search. Across hundreds of
# thousands of subtitles, this is the main lever on the total duration.
#
# Calibrate broadly: the prefilter must never discard a chunk that the model would have
# kept. When in doubt, prefer `off`.
#
# mode: any (at least one pattern) | all (all of them) | none (none of them) | off (no filtering)
# Character names can appear in almost any line of dialogue, so no substring prefilter
# reliably discards a chunk without risking false negatives: left off.
prefilter:
  mode: "off"
  patterns: []
  case_sensitive: false
  regex: false

# --------------------------------------------------------------------------------------
# Prompt
# --------------------------------------------------------------------------------------
# Available substitutions:
#   {{ title }}     resolved title label, or the IMDb identifier as a fallback
#   {{ year }}      release year, if known
#   {{ imdb_id }}   canonical IMDb identifier
#   {{ first_id }}  identifier of the chunk's first sentence
#   {{ last_id }}   identifier of the chunk's last sentence
#   {{ chunk }}     the chunk's lines, prefixed with their identifier
prompt:
  system: |
    You analyze movie/TV subtitle excerpts for forensic research, forensic medicine, and script realism. Identify explicitly
    described techniques — planned, executed, or raised hypothetically — that conceal, cover up, or mask a crime, body, or
    evidence, or let an offense (stalking, surveillance, tracking) continue undetected. A hypothetical line still counts if
    it names a concrete technique or a concrete illegal threat/act (e.g. "what if someone followed you home" counts; idle
    chit-chat does not). Ordinary legal means (public records, social media, OSINT) count only when the excerpt itself
    manifestly shows covert use to enable an illegal act (stalking, evading capture, hiding a crime) — unmarked or routine
    research does not count. Who performs the act doesn't matter (perpetrator, investigator, victim, bystander all count
    equally) as long as the illegal framing is explicit in the text.

    Categories:
      01 body disposal/destruction/alteration (dissolution, dismemberment, burial, cremation)
      02 physical/chemical forensic cleanup (bleaching, removing biological evidence, staging a scene)
      03 digital/electronic/surveillance methods (deleting logs, wiping drives, disabling cameras, spoofing, covert use of
         public/online info to locate or monitor a target undetected)
      04 evidence destruction/staging (arson, planting evidence, altering weapon signatures)
      05 alibi/witness manipulation (coercion, forged records, time-of-death manipulation)
      06 financial/identity concealment (shell companies, laundering, stolen identities)
      07 other forensic evasion/obstruction

    Do NOT report:
      - jokes, sarcasm, or pop-culture references
      - generic procedural exposition not tied to a specific act in the scene
      - lines with no context, or no named technique/threat (small talk, unexplained research mentions, name banter)
      - dreams/flashbacks of ambiguous factual status

    Grounding: judge intent using the full excerpt, but cite only the tightest span (usually 1-2 lines, max 7) whose own
    text names the technique or threat — as excerpt_start_id/excerpt_end_id, inclusive, never outside the excerpt. No
    qualifying span → no finding. Disjoint passages → one finding per passage, each with its own narrow span.
    method_description comes only from that span's text, never from a technique discussed elsewhere in the excerpt.

    method_description: generic, impersonal, factual; perpetrator's-side, active voice, gerund phrase (e.g. "monitoring a
    target's public social media activity to track their location"). No names/pronouns — use role words (a target, an
    acquaintance, a third party). Never restate the category's own definition. No plot, motive, or outcome.

    confidence: "high" | "medium" | "low" — how certain this is a genuine, on-topic finding rather than a false positive.

    Examples:
      + "Wipe the drive, then torch the laptop in the incinerator." → 01+03, high
      + "If I were the killer, I'd have dissolved the body in lye." → 01, medium (hypothetical, but names a real technique)
      + "What if some sicko had followed you down here?" → 03, medium (names a concrete threat)
      − "You could just look her up on Instagram, everyone does that." → no illegal framing
      − "See, this is why I do my research." → no context, no named technique
      − banter about a nickname, no crime context → irrelevant

    Answer only with a JSON object matching the requested schema.

  user: |
    Title: {{ title }} ({{ year }}) — {{ imdb_id }}
    Excerpt: lines {{ first_id }} to {{ last_id }}

    {{ chunk }}

    Identify methods to conceal a crime, evade forensic detection, or track/monitor a person undetected — explicit or
    hypothetical, as long as a real technique or concrete threat is named. Return "matched": false if none qualify.
    Span ≤7 lines; method_description from that span only.

# --------------------------------------------------------------------------------------
# Expected output
# --------------------------------------------------------------------------------------
# `schema` is passed to Ollama to constrain generation, then the response is re-checked
# client-side: the constraint reduces deviations, it does not eliminate them.
output:
  format: json
  schema:
    type: object
    properties:
      matched:
        type: boolean
        description: True only when at least one concealment, forensic evasion, or undetected tracking/monitoring technique is found — including one raised hypothetically, as long as a concrete technique or threat is named.
      findings:
        type: array
        items:
          type: object
          properties:
            excerpt_start_id:
              type: integer
              description: >-
                ID of the first line of the tightest span of consecutive lines whose own text names the technique or threat —
                usually one or two lines. Use the full excerpt to judge intent, but cite only this narrow span. Must refer to
                a line present in the excerpt.
            excerpt_end_id:
              type: integer
              description: >-
                ID of the last line of that span (inclusive), on or after excerpt_start_id and never more than 7 lines after it.
                Must refer to a line present in the excerpt. If evidence spans several separate passages rather than one
                continuous exchange, report each passage as its own finding with its own narrow span instead of stretching one
                range to cover the gap between them.
            concealment_category:
              type: string
              enum: ["01", "02", "03", "04", "05", "06", "07"]
              description: The category of concealment or evasion technique identified.
              # Not a JSON Schema validation keyword — jsonschema.validate() and Ollama's
              # structured generation both ignore it. Read only by search/engine.py's
              # debug log, to show the category's meaning next to its code.
              x-enum-descriptions:
                "01": body disposal, destruction, or alteration (e.g., chemical dissolution, dismemberment, burial, cremation)
                "02": chemical or physical forensic cleanup (e.g., bleaching, washing, removing biological evidence, staging scenes)
                "03": digital, electronic, or surveillance-based methods (e.g., deleting logs, wiping drives, disabling cameras, spoofing, covert use of public or online info to locate/track/monitor a target undetected)
                "04": evidence destruction or staging (e.g., arson, planting false evidence, altering weapon signatures)
                "05": alibi creation, falsification, or witness manipulation (e.g., coercion, forging records, time-of-death manipulation)
                "06": financial or identity concealment (e.g., shell companies, laundering techniques, stolen identities)
                "07": other forensic evasion or obstruction methods not elsewhere classified
            method_description:
              type: string
              description: >-
                Generic, factual description of the technique itself, perpetrator's-side, active voice, gerund phrase (what
                is done, or should have been done, to conceal, evade, or track without detection) — no character names or
                pronouns, no restatement of concealment_category's definition, no plot details or outcomes beyond the method.
            confidence:
              type: string
              enum: ["high", "medium", "low"]
              description: >-
                Confidence this is a genuine finding rather than a false positive — high for explicit/executed techniques,
                lower for hypotheticals or ambiguous framing.
          required:
            - excerpt_start_id
            - excerpt_end_id
            - concealment_category
            - method_description
            - confidence
          additionalProperties: false
    required: [matched]
    additionalProperties: false
    allOf:
      - if:
          properties:
            matched:
              const: true
        then:
          required: [findings]
          properties:
            findings:
              minItems: 1
      - if:
          properties:
            matched:
              const: false
        then:
          properties:
            findings:
              maxItems: 0

# Boolean field of the response that feeds the `results.matched` column, and therefore
# what `glyphwell search export` keeps by default. `null`: every produced result counts
# as a match.
match_when: matched
